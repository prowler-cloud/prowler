  # CVE-2026-78667 and CVE-2026-97031 are DoS bugs in the Go standard library: net/http
  # burns CPU parsing a Range header with a large number of small ranges in FileServer,
  # ServeContent and ServeFile, and crypto/tls lets a client exhaust server memory with
  # multiple ECH outer extension references. Both are server-side code paths. Fixed in
  # Go 1.26.9 and 1.27.2 (released 2026-10-08). Trivy 0.75.0, the latest published
  # release and the version the images ship, is built with go1.27.1, and Trivy main
  # still declares `go 1.27.0`:
  # https://github.com/aquasecurity/trivy/blob/v0.75.0/go.mod
  # Prowler invokes Trivy exclusively as `trivy fs` and `trivy image` on a local path,
  # never `trivy server`, so no HTTP or TLS listener ever exists in the image; its only
  # TLS use is as a client pulling the vulnerability database. The purl is pinned to the
  # stdlib version so the entry retires itself on the next Trivy bump. Remove this
  # temporary suppression as soon as a Trivy release is built with Go >= 1.27.2.
  - id: CVE-2026-78667
    purls:
      - "pkg:golang/stdlib@v1.27.1"
    expired_at: 2026-11-15
  - id: CVE-2026-97031
    purls:
      - "pkg:golang/stdlib@v1.27.1"
    expired_at: 2026-11-15

