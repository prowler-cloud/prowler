name: Audit Agent (zero-touch)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repository (owner/name). Empty = all entries in contrib/audit-agent/targets.yml"
        required: false
        default: ""
      pr_number:
        description: "Optional PR number on the target repo (posts sticky comment + check)"
        required: false
        default: ""
      sync_issues:
        description: "Sync control-gap issues on the target repo"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prowler (orchestrator)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve targets
        id: targets
        shell: bash
        env:
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_REPO}" ]; then
            echo "list=${INPUT_REPO}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Parse targets.yml without PyYAML: extract "repo: owner/name" lines
          mapfile -t repos < <(grep -E '^\s*-\s*repo:' contrib/audit-agent/targets.yml | sed -E 's/.*repo:[[:space:]]*//')
          if [ "${#repos[@]}" -eq 0 ]; then
            echo "::error::No targets found in contrib/audit-agent/targets.yml"
            exit 1
          fi
          IFS=','
          echo "list=${repos[*]}" >> "$GITHUB_OUTPUT"

      - name: Run Audit Agent
        env:
          AUDIT_AGENT_TOKEN: ${{ secrets.AUDIT_AGENT_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_PRS: ${{ inputs.pr_number }}
          INPUT_SYNC: ${{ inputs.sync_issues }}
          TARGETS: ${{ steps.targets.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AUDIT_AGENT_TOKEN}" ]; then
            echo "::error::Set repository secret AUDIT_AGENT_TOKEN (PAT with access to target repos)."
            exit 1
          fi
          export PYTHONPATH="${GITHUB_WORKSPACE}/contrib/audit-agent:${PYTHONPATH:-}"
          IFS=',' read -r -a repos <<< "${TARGETS}"
          status=0
          for repo in "${repos[@]}"; do
            repo="$(echo "$repo" | xargs)"
            [ -z "$repo" ] && continue
            echo "::group::Auditing ${repo}"
            args=(--repo "${repo}" --json-summary)
            if [ -n "${INPUT_PRS}" ]; then
              args+=(--pr "${INPUT_PRS}")
            else
              args+=(--dry-run)
            fi
            if [ "${INPUT_SYNC}" = "true" ]; then
              args+=(--sync-issues)
              # When syncing issues without a PR, drop dry-run by re-invoking without --dry-run
              args=(--repo "${repo}" --json-summary --sync-issues)
            fi
            python -m audit_agent "${args[@]}" || status=$?
            echo "::endgroup::"
          done
          exit $status
