name: 'UI: CodeQL'

on:
  push:
    branches:
      - 'master'
      - 'v5.*'
    paths:
      - 'ui/**'
      - '.github/workflows/ui-codeql.yml'
      - '.github/codeql/ui-codeql-config.yml'
      - '!ui/CHANGELOG.md'
      - '!ui/changelog.d/**'
  pull_request:
    branches:
      - 'master'
      - 'v5.*'
    paths:
      - 'ui/**'
      - '.github/workflows/ui-codeql.yml'
      - '.github/codeql/ui-codeql-config.yml'
      - '!ui/CHANGELOG.md'
      - '!ui/changelog.d/**'
  schedule:
    - cron: '00 12 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ui-analyze:
    if: github.repository == 'prowler-cloud/prowler'
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - 'javascript-typescript'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/ui-codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:${{ matrix.language }}'
