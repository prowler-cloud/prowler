apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: prowler-secret
stringData:
  # Generate your own key pair before installing the chart. Do not reuse keys
  # from any file committed to a repository.
  #   openssl genrsa -out private.pem 2048
  # Replace this placeholder with the complete contents of private.pem, from
  # its -----BEGIN PRIVATE KEY----- line through its -----END PRIVATE KEY-----
  # line, indenting every line by four spaces so the block scalar keeps them.
  # The key value must contain exactly one delimiter pair.
  DJANGO_TOKEN_SIGNING_KEY: |
    <paste the complete contents of private.pem here>

  #   openssl rsa -in private.pem -pubout -out public.pem
  # Replace this placeholder with the complete contents of public.pem, from
  # its -----BEGIN PUBLIC KEY----- line through its -----END PUBLIC KEY-----
  # line, indenting every line by four spaces so the block scalar keeps them.
  # The key value must contain exactly one delimiter pair.
  DJANGO_TOKEN_VERIFYING_KEY: |
    <paste the complete contents of public.pem here>

  #   openssl rand -base64 32
  DJANGO_SECRETS_ENCRYPTION_KEY: "<paste the output of the command here>"

  #   openssl rand -base64 32
  AUTH_SECRET: "<paste the output of the command here>"

  # Unfortunatelly, we need to duplicate the password in two different keys because the Neo4j Helm Chart expects the password in the NEO4J_AUTH key and the application expects it in the NEO4J_PASSWORD key.
  NEO4J_PASSWORD: "<choose a strong password>"
  NEO4J_AUTH: "neo4j/<choose a strong password>"
