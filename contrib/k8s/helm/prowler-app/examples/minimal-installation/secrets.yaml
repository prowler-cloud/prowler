apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: prowler-secret
stringData:
  # Every value below must be generated for your own installation. The values that
  # used to ship here were public, and the API refuses to start with them.

  # openssl genrsa -out private.pem 2048
  DJANGO_TOKEN_SIGNING_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE WITH THE CONTENTS OF private.pem
    -----END PRIVATE KEY-----

  # openssl rsa -in private.pem -pubout -out public.pem
  DJANGO_TOKEN_VERIFYING_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE WITH THE CONTENTS OF public.pem
    -----END PUBLIC KEY-----

  # openssl rand -base64 32
  # Protects stored provider, integration and LLM credentials. Changing it later
  # leaves the existing ones unreadable, so set it before the first scan.
  DJANGO_SECRETS_ENCRYPTION_KEY: ""

  # openssl rand -base64 32
  AUTH_SECRET: ""

  # Unfortunatelly, we need to duplicate the password in two different keys because the Neo4j Helm Chart expects the password in the NEO4J_AUTH key and the application expects it in the NEO4J_PASSWORD key.
  NEO4J_PASSWORD: "prowler-password-fake"
  NEO4J_AUTH: "neo4j/prowler-password-fake"
