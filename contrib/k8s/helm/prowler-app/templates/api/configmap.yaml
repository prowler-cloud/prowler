kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "prowler.fullname" . }}-api
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.api.djangoConfig }}
  {{- if eq $key "DJANGO_ALLOWED_HOSTS" }}
  {{ $key }}: {{ include "prowler.api.allowedHosts" $ | quote }}
  {{- else }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
