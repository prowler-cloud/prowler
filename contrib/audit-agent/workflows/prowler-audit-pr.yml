# Optional: copy into a repository that wants local CI.
# Zero-touch audits do NOT require this — use the central orchestrator instead.
name: Prowler Audit Agent (PR)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write
  actions: read
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prowler-cloud/prowler/.github/actions/prowler-audit@e18cb600360428f1d4bca8e2cd066d031ed9194c
        with:
          mode: pr
